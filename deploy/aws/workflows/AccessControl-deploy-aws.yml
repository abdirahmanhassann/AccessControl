# Copy to .github/workflows/deploy-aws.yml in the AccessControl repo.
#
# On every push to master: build the API image, push it to ECR, then on the
# EC2 server run the SQL scripts in deploy/aws/migrations.txt and swap the api
# container. If the new container does not answer, the server puts the previous
# one back and this run fails. One-time setup: deploy/aws/README.md.
name: Deploy API to AWS

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'deploy/azure-vm/**']
  workflow_dispatch:

permissions:
  id-token: write # sign in to AWS with GitHub's OIDC token, no stored keys
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
  ECR_REPOSITORY: ac-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Prepare the server commands
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo 'set -euo pipefail'
            # Refresh the deploy script on the server, so it always matches this commit.
            # (tr: a Windows checkout may have given the script CRLF line endings)
            echo "echo '$(tr -d '\r' < deploy/aws/server-deploy.sh | base64 -w0)' | base64 -d > /opt/ac/deploy.sh"
            echo 'chmod 755 /opt/ac/deploy.sh'
            files=()
            while IFS= read -r f; do
              case "$f" in ''|'#'*) continue ;; esac
              name="/tmp/ac-migration-$(basename "$f")"
              echo "echo '$(base64 -w0 "$f")' | base64 -d > '$name'"
              files+=("'$name'")
            done < deploy/aws/migrations.txt
            if [ "${#files[@]}" -gt 0 ]; then echo "/opt/ac/deploy.sh migrate ${files[*]}"; fi
            echo "/opt/ac/deploy.sh api '$IMAGE'"
          } > remote.sh
          jq -n --rawfile script remote.sh '{commands: [$script], executionTimeout: ["1200"]}' > ssm-params.json
          echo "Server script is $(wc -c < remote.sh) bytes"

      - name: Deploy on the server
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "AccessControl API ${GITHUB_SHA::7}" \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          echo "::group::Server output"
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2 || true
          echo "::endgroup::"
          if [ "$status" != "Success" ]; then
            echo "::error::Deploy finished with status $status"
            exit 1
          fi
