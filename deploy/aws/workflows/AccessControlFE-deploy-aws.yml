# Copy to .github/workflows/deploy-aws.yml in the AccessControlFE repo.
#
# On every push to main: run the end-to-end tests, build the frontend image,
# push it to ECR, then swap the web container on the EC2 server. If the new
# container does not answer, the server puts the previous one back and this run
# fails. One-time setup: deploy/aws/README.md in the AccessControl repo.
name: Deploy frontend to AWS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  id-token: write # sign in to AWS with GitHub's OIDC token, no stored keys
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
  ECR_REPOSITORY: ac-web

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # package-lock.json is out of step with package.json, so `npm ci` refuses it.
      # Switch to `npm ci` once the lock file is regenerated and committed.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (demo API)
        run: npm run test:e2e

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Set the VITE_API_BASE_URL repository variable (e.g. https://api.yourdomain.com)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Deploy on the server
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          # deploy.sh is installed by the API pipeline; run that once before the first frontend deploy.
          script="set -euo pipefail
          test -x /opt/ac/deploy.sh || { echo 'deploy.sh is missing on the server: run the AccessControl API pipeline once first.' >&2; exit 1; }
          /opt/ac/deploy.sh web '$IMAGE'"
          jq -n --arg script "$script" '{commands: [$script], executionTimeout: ["900"]}' > ssm-params.json
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "AccessControl web ${GITHUB_SHA::7}" \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          echo "::group::Server output"
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2 || true
          echo "::endgroup::"
          if [ "$status" != "Success" ]; then
            echo "::error::Deploy finished with status $status"
            exit 1
          fi
