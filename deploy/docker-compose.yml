services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports: ["1433:1433"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes: [dbdata:/var/opt/mssql]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 30
  api:
    image: ac-api
    env_file: api.env
    environment:
      ConnectionStrings__AccessControlDB: "Server=db,1433;Database=AccessControl;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      PublicApiBaseUrl: https://${API_HOST}
    volumes: [uploads:/app/wwwroot/uploads]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  web:
    image: ac-web
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: { APP_HOST: "${APP_HOST}", API_HOST: "${API_HOST}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
    depends_on: [api, web]
    restart: unless-stopped
volumes: { dbdata: {}, uploads: {}, caddy_data: {} }
